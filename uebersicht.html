<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aufmaßliste Übersicht</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid #333;
        }

        h1 {
            color: #333;
            font-size: 2em;
        }

        .datum {
            font-size: 1.2em;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #333;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border: 1px solid #000;
        }

        td {
            padding: 10px 12px;
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .stamm-row {
            background: #e8e8e8;
            font-weight: 700;
            font-size: 1.1em;
        }

        .holzart-row {
            background: #f0f0f0;
            font-weight: 600;
            padding-left: 30px;
        }

        .kategorie-row {
            background: #f8f8f8;
            font-weight: 500;
            padding-left: 60px;
        }

        .staerke-row {
            padding-left: 90px;
        }

        .summe-row {
            background: #d0d0d0;
            font-weight: 700;
            border-top: 2px solid #000;
        }

        .number {
            text-align: right;
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
        }

        .print-btn:hover {
            background: #555;
        }

        .filter-section {
            background: #f5f5f5;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }

        .filter-row {
            display: flex;
            gap: 20px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filter-group label {
            font-weight: 600;
            color: #333;
        }

        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #999;
            font-size: 1em;
        }

        .filter-btn {
            padding: 8px 24px;
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
        }

        .filter-btn:hover {
            background: #555;
        }

        .export-btn {
            position: fixed;
            top: 70px;
            right: 20px;
            padding: 12px 24px;
            background: #228B22;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
        }

        .export-btn:hover {
            background: #1a6b1a;
        }

        @media print {
            .print-btn, .filter-section, .export-btn {
                display: none;
            }
        }

        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2em;
            color: #666;
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">🖨️ Drucken</button>
    <button class="export-btn" onclick="exportToCSV()">📥 CSV Export</button>

    <div class="container">
        <div class="header">
            <h1>Aufmaßliste</h1>
            <div class="datum" id="schnittdatum">Schnittdatum: -</div>
        </div>

        <div class="filter-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="stammnummerSuche">Stammnummer:</label>
                    <input type="text" id="stammnummerSuche" placeholder="z.B. 001">
                </div>
                <div class="filter-group">
                    <label for="datumVon">Schnittdatum von:</label>
                    <input type="date" id="datumVon">
                </div>
                <div class="filter-group">
                    <label for="datumBis">Schnittdatum bis:</label>
                    <input type="date" id="datumBis">
                </div>
                <button class="filter-btn" onclick="loadData()">🔍 Filtern</button>
            </div>
        </div>

        <div id="loading" class="loading">Lade Daten...</div>
        
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>Stammnummer</th>
                    <th>Holzart</th>
                    <th>Kategorie</th>
                    <th>Stärke (mm)</th>
                    <th class="number">Anzahl</th>
                    <th class="number">Summe m³</th>
                    <th class="number">Summe m²</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // Supabase initialisieren
        const SUPABASE_URL = 'https://ohjmhitetpmvwalqcdzy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9oam1oaXRldHBtdndhbHFjZHp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMDgxMTIsImV4cCI6MjA5Nzg4NDExMn0.Jncbnnqkj-61ljoQrvsv-6cylw25m_cJLa0TyocPTwg';
        
        const { createClient } = window.supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentData = []; // Aktuelle Daten für Export

        async function loadData() {
            const stammnummerSuche = document.getElementById('stammnummerSuche').value;
            const datumVon = document.getElementById('datumVon').value;
            const datumBis = document.getElementById('datumBis').value;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('dataTable').style.display = 'none';

            let query = supabaseClient
                .from('holz_eintraege')
                .select('*');

            // Stammnummer-Filter (optional)
            if (stammnummerSuche) {
                query = query.eq('stammnummer', stammnummerSuche);
            }

            // Datumsfilter anwenden
            if (datumVon) {
                query = query.gte('datum_von', datumVon);
            }
            if (datumBis) {
                query = query.lte('datum_bis', datumBis);
            }

            const { data, error } = await query.order('stammnummer', { ascending: true });

            if (error) {
                console.error('Fehler beim Laden:', error);
                document.getElementById('loading').innerHTML = 'Fehler beim Laden der Daten: ' + error.message;
                return;
            }

            document.getElementById('loading').style.display = 'none';

            if (!data || data.length === 0) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loading').innerHTML = 'Keine Daten für den ausgewählten Zeitraum vorhanden';
                return;
            }

            // Schnittdatum anzeigen
            const datumVonDisplay = datumVon || 'Anfang';
            const datumBisDisplay = datumBis || 'Heute';
            document.getElementById('schnittdatum').textContent = `Schnittdatum: ${datumVonDisplay} bis ${datumBisDisplay}`;

            currentData = data; // Daten für Export speichern
            buildTable(data);
            document.getElementById('dataTable').style.display = 'table';
        }

        function buildTable(entries) {
            // Hierarchisch gruppieren
            const tree = {};

            entries.forEach(entry => {
                const stamm = entry.stammnummer || 'Unbekannt';
                const holzart = entry.holzart || 'Unbekannt';
                const kategorie = entry.kategorie || 'Unbekannt';
                const staerke = entry.staerke || 'Unbekannt';

                if (!tree[stamm]) tree[stamm] = {};
                if (!tree[stamm][holzart]) tree[stamm][holzart] = {};
                if (!tree[stamm][holzart][kategorie]) tree[stamm][holzart][kategorie] = {};
                if (!tree[stamm][holzart][kategorie][staerke]) {
                    tree[stamm][holzart][kategorie][staerke] = {
                        stueck: 0,
                        quadratmeter: 0,
                        kubikmeter: 0
                    };
                }

                const staerkeData = tree[stamm][holzart][kategorie][staerke];
                staerkeData.stueck += parseInt(entry.stueck) || 0;
                staerkeData.quadratmeter += parseFloat(entry.quadratmeter) || 0;
                staerkeData.kubikmeter += parseFloat(entry.kubikmeter) || 0;
            });

            // Tabelle generieren
            const tbody = document.getElementById('tableBody');
            let html = '';

            let gesamtStueck = 0;
            let gesamtQuadrat = 0;
            let gesamtKubik = 0;

            for (const stamm in tree) {
                const stammTotals = calculateTotals(tree[stamm]);
                
                // Stamm-Zeile
                html += `
                    <tr class="stamm-row">
                        <td colspan="4">Stamm: ${stamm}</td>
                        <td class="number">${stammTotals.stueck}</td>
                        <td class="number">${stammTotals.kubikmeter.toFixed(3)}</td>
                        <td class="number">${stammTotals.quadratmeter.toFixed(2)}</td>
                    </tr>
                `;

                for (const holzart in tree[stamm]) {
                    const holzartTotals = calculateTotals(tree[stamm][holzart]);
                    
                    // Holzart-Zeile
                    html += `
                        <tr class="holzart-row">
                            <td></td>
                            <td colspan="3">${holzart}</td>
                            <td class="number">${holzartTotals.stueck}</td>
                            <td class="number">${holzartTotals.kubikmeter.toFixed(3)}</td>
                            <td class="number">${holzartTotals.quadratmeter.toFixed(2)}</td>
                        </tr>
                    `;

                    for (const kategorie in tree[stamm][holzart]) {
                        const kategorieTotals = calculateTotals(tree[stamm][holzart][kategorie]);
                        
                        // Kategorie-Zeile
                        html += `
                            <tr class="kategorie-row">
                                <td></td>
                                <td></td>
                                <td colspan="2">${kategorie}</td>
                                <td class="number">${kategorieTotals.stueck}</td>
                                <td class="number">${kategorieTotals.kubikmeter.toFixed(3)}</td>
                                <td class="number">${kategorieTotals.quadratmeter.toFixed(2)}</td>
                            </tr>
                        `;

                        for (const staerke in tree[stamm][holzart][kategorie]) {
                            const staerkeData = tree[stamm][holzart][kategorie][staerke];
                            
                            // Stärke-Zeile
                            html += `
                                <tr class="staerke-row">
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td>${staerke} mm</td>
                                    <td class="number">${staerkeData.stueck}</td>
                                    <td class="number">${staerkeData.kubikmeter.toFixed(3)}</td>
                                    <td class="number">${staerkeData.quadratmeter.toFixed(2)}</td>
                                </tr>
                            `;
                        }
                    }
                }

                gesamtStueck += stammTotals.stueck;
                gesamtQuadrat += stammTotals.quadratmeter;
                gesamtKubik += stammTotals.kubikmeter;
            }

            // Gesamtsumme
            html += `
                <tr class="summe-row">
                    <td colspan="4">GESAMT</td>
                    <td class="number">${gesamtStueck}</td>
                    <td class="number">${gesamtKubik.toFixed(3)}</td>
                    <td class="number">${gesamtQuadrat.toFixed(2)}</td>
                </tr>
            `;

            tbody.innerHTML = html;
        }

        function calculateTotals(obj) {
            let totals = { stueck: 0, quadratmeter: 0, kubikmeter: 0 };

            function traverse(node) {
                if (node.stueck !== undefined) {
                    totals.stueck += node.stueck;
                    totals.quadratmeter += node.quadratmeter;
                    totals.kubikmeter += node.kubikmeter;
                } else {
                    for (const key in node) {
                        traverse(node[key]);
                    }
                }
            }

            traverse(obj);
            return totals;
        }

        function exportToCSV() {
            if (!currentData || currentData.length === 0) {
                alert('Keine Daten zum Exportieren vorhanden. Bitte zuerst Daten laden.');
                return;
            }

            // Gruppierung nach Stamm -> Paketnummer
            const grouped = {};

            currentData.forEach(entry => {
                const stamm = entry.stammnummer || 'Unbekannt';
                const paket = entry.paketnummer || 'Ohne Paketnummer';

                if (!grouped[stamm]) {
                    grouped[stamm] = {};
                }

                if (!grouped[stamm][paket]) {
                    grouped[stamm][paket] = {
                        entries: [],
                        totalKubikmeter: 0,
                        totalQuadratmeter: 0,
                        totalStueck: 0,
                        totalLaenge: 0,
                        totalBreite: 0,
                        totalStaerke: 0
                    };
                }

                grouped[stamm][paket].entries.push(entry);
                grouped[stamm][paket].totalKubikmeter += parseFloat(entry.kubikmeter) || 0;
                grouped[stamm][paket].totalQuadratmeter += parseFloat(entry.quadratmeter) || 0;
                grouped[stamm][paket].totalStueck += parseInt(entry.stueck) || 0;
                grouped[stamm][paket].totalLaenge += parseFloat(entry.laenge) || 0;
                grouped[stamm][paket].totalBreite += parseFloat(entry.breite) || 0;
                grouped[stamm][paket].totalStaerke += parseFloat(entry.staerke) || 0;
            });

            // CSV erstellen mit den spezifizierten Feldern
            const headers = ['lot_length', 'width', 'thickness', 'lot_name', 'Holzart', 'Sortierung', 'product_id', 'units', 'ausbuchen'];
            let csvContent = headers.join(';') + '\n';

            // Zeilen erstellen
            for (const stamm in grouped) {
                for (const paket in grouped[stamm]) {
                    const group = grouped[stamm][paket];
                    const count = group.entries.length;
                    
                    // Durchschnitte für Länge, Breite, Stärke berechnen (mit Punkt als Dezimaltrennzeichen)
                    const avgLaenge = count > 0 ? (group.totalLaenge / count).toFixed(2) : '0.00';
                    const avgBreite = count > 0 ? (group.totalBreite / count).toFixed(2) : '0.00';
                    const avgStaerke = count > 0 ? (group.totalStaerke / count).toFixed(2) : '0.00';
                    
                    // Alle Kategorien, Holzarten und Qualitäten sammeln und die häufigste verwenden
                    const kategorien = {};
                    const holzarten = {};
                    const qualitaeten = {};
                    
                    group.entries.forEach(entry => {
                        const kat = entry.kategorie || '';
                        const hol = entry.holzart || '';
                        const qual = entry.qualitaet || '';
                        kategorien[kat] = (kategorien[kat] || 0) + 1;
                        holzarten[hol] = (holzarten[hol] || 0) + 1;
                        qualitaeten[qual] = (qualitaeten[qual] || 0) + 1;
                    });
                    
                    // Die häufigste Kategorie, Holzart und Qualität nehmen
                    const kategorie = Object.keys(kategorien).reduce((a, b) => kategorien[a] > kategorien[b] ? a : b, '');
                    const holzart = Object.keys(holzarten).reduce((a, b) => holzarten[a] > holzarten[b] ? a : b, '');
                    const qualitaet = Object.keys(qualitaeten).reduce((a, b) => qualitaeten[a] > qualitaeten[b] ? a : b, '');

                    // Holzart-Abkürzung erstellen
                    const holzartMap = {
                        'Eiche': 'EI',
                        'Buche': 'BU',
                        'Esche': 'ES',
                        'Ahorn': 'AH',
                        'Kirsche': 'KI',
                        'Nussbaum': 'NU',
                        'Birke': 'BI',
                        'Lärche': 'LA',
                        'Douglasie': 'DO',
                        'Kiefer': 'KF'
                    };
                    const holzartAbk = holzartMap[holzart] || holzart.substring(0, 2).toUpperCase();

                    // Stärke ohne Dezimalstellen für product_id
                    const staerkeGerundet = count > 0 ? Math.round(group.totalStaerke / count) : 0;

                    // product_id erstellen basierend auf Kategorie
                    let productId = '';
                    if (kategorie === 'SH') {
                        // SH: SH-Holzart-Qualität
                        productId = `SH-${holzartAbk}-${qualitaet}`;
                    } else if (kategorie === 'SF') {
                        // SF: SF-Holzart-Qualität-Stärke (ohne Dezimalstellen)
                        productId = `SF-${holzartAbk}-${qualitaet}-${staerkeGerundet}`;
                    } else {
                        // Fallback für andere Kategorien
                        productId = stamm;
                    }

                    // Units: Für alle Kategorien die Stückzahl
                    const units = group.totalStueck;

                    const row = [
                        `\t${avgLaenge}`,    // lot_length (Durchschnitt Länge in m) - Tab für Excel-Textformat
                        `\t${avgBreite}`,    // width (Durchschnitt Breite in mm) - Tab für Excel-Textformat
                        `\t${avgStaerke}`,   // thickness (Durchschnitt Stärke in mm) - Tab für Excel-Textformat
                        paket,               // lot_name (Paketnummer)
                        holzart,             // Holzart
                        kategorie,           // Sortierung (Kategorie)
                        productId,           // product_id (formatiert nach Kategorie)
                        units,               // units (Stückzahl für alle)
                        stamm                // ausbuchen (Stammnummer)
                    ];

                    csvContent += row.join(';') + '\n';
                }
            }

            // CSV-Datei herunterladen
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            
            const today = new Date().toISOString().split('T')[0];
            link.setAttribute('href', url);
            link.setAttribute('download', `aufmassliste_${today}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
